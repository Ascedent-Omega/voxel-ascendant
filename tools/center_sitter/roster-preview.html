         const mesh=new THREE.Mesh(new THREE.BoxGeometry(...size.map(n=>Math.max(n+inflate*2,.025))),view.materials[color]);
         const center=origin.map((n,j)=>n+size[j]/2);
         if(rotation){const p=new THREE.Group();p.position.copy(v(cp).sub(v(pivot)));p.rotation.set(...rotation.map(rad),'ZYX');mesh.position.copy(v(center).sub(v(cp)));p.add(mesh);node.add(p);}
         else{mesh.position.copy(v(center).sub(v(pivot)));node.add(mesh);}
       }
     }
     view.group=group;view.bones=bones;view.scene.add(group);
   }
   el('front-title').textContent=model.name+' · Front';
   for(const view of views)view.size(view.stage.clientWidth,view.stage.clientHeight,Math.min(devicePixelRatio||1,2));
   render();
 }
 function sample(keys,t){
   if(Array.isArray(keys))return keys;
   const a=Object.entries(keys).map(([k,v])=>[+k,v]).sort((x,y)=>x[0]-y[0]);
   if(t<=a[0][0])return a[0][1];
   for(let i=1;i<a.length;i++)if(t<=a[i][0]){const [x,u]=a[i-1],[y,w]=a[i],f=(t-x)/(y-x);return u.map((n,j)=>n+(w[j]-n)*f);}
   return a.at(-1)[1];
 }
 function clip(view,name,t){for(const [n,c] of Object.entries(data.clips[name].bones)){const node=view.bones[n];if(!node)continue;if(c.rotation)node.rotation.set(...sample(c.rotation,t).map(rad),'ZYX');if(c.position)node.position.add(v(sample(c.position,t)));if(c.scale)node.scale.copy(v(sample(c.scale,t)));}}
 function draw(view,facing,action,t,bt){
   view.camera.position.set(facing==='right'?110:facing==='left'?-110:0,25,facing==='front'?-110:facing==='back'?110:0);view.camera.lookAt(0,25,0);
   for(const node of Object.values(view.bones)){node.position.copy(node.userData.rest);node.rotation.set(0,0,0);node.scale.set(1,1,1);}
   clip(view,action,t%data.clips[action].animation_length);clip(view,'blink',bt%4);view.renderer.render(view.scene,view.camera);
   view.renderer.domElement.dataset.legAngle=view.bones.leg_left.rotation.x;view.renderer.domElement.dataset.eyeScale=view.bones.eye_left.scale.y;
 }
 function render(){if(!current)return;for(const view of views)draw(view,view.d==='front'?'front':direction.value,pose.value,time,manual===null?blinkTime:2.65+manual);
   el('side-title').textContent=current.name+' · '+({right:'Rechts',left:'Links',back:'Rücken'}[direction.value]);
   phase.value=String(time%data.clips[pose.value].animation_length/data.clips[pose.value].animation_length*100);
   play.textContent=playing?'Pause':'Abspielen';play.setAttribute('aria-pressed',String(playing));
   const s=(data.models.indexOf(current)+1)+' / '+data.models.length+' · '+current.group+' · '+(playing?'Animation läuft':'Pausiert');if(status.textContent!==s)status.textContent=s;
 }
 function frame(now){raf=null;if(!root.isConnected){for(const v of views){v.observer.disconnect();v.renderer.dispose();}return;}const dt=last===null?0:Math.min((now-last)/1000,.1);last=now;if(!document.hidden){if(playing){time+=dt;blinkTime+=dt;}if(manual!==null){manual+=dt;if(manual>.36)manual=null;}render();}if(playing||manual!==null)raf=requestAnimationFrame(frame);}
 function start(){if(raf===null){last=null;raf=requestAnimationFrame(frame);}}
 function save(){window.openai?.setWidgetState?.({modelContent:{version:'kanto-roster-1',character:current.id,direction:direction.value,pose:pose.value,playing},privateContent:null}).catch(()=>{});}
 function restore(s){const a=s?.modelContent;if(a?.version!=='kanto-roster-1')return;if(['right','left','back'].includes(a.direction))direction.value=a.direction;if(['ground_walk','ground_idle'].includes(a.pose))pose.value=a.pose;if(typeof a.playing==='boolean')playing=a.playing&&!reduced.matches;load(a.character);if(playing)start();}
 select.addEventListener('change',()=>{load(select.value);save();});
 for(const [id,step] of [['prev',-1],['next',1]])el(id).addEventListener('click',()=>{load(data.models[(data.models.indexOf(current)+step+data.models.length)%data.models.length].id);save();});
 direction.addEventListener('change',()=>{render();save();});pose.addEventListener('change',()=>{time=0;render();save();});
 play.addEventListener('click',()=>{playing=!playing;render();if(playing)start();save();});
 el('blink').addEventListener('click',()=>{manual=0;render();start();});
 phase.addEventListener('input',()=>{playing=false;time=+phase.value/100*data.clips[pose.value].animation_length;render();});phase.addEventListener('change',save);
 reduced.addEventListener('change',e=>{if(e.matches){playing=false;render();}});
 window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
 root.selectModel=id=>load(id);root.models=data.models.map(m=>({id:m.id,name:m.name,group:m.group}));
 root.exportFrame=({id,direction='front',action='ground_walk',time=0,blinkTime=0,width=256,height=320})=>{
   if(id!==current.id)load(id);playing=false;manual=null;if(raf!==null){cancelAnimationFrame(raf);raf=null;}
   const view=views[0];view.size(width,height);draw(view,direction,action,time,blinkTime);
   return {png:view.renderer.domElement.toDataURL(),camera:{orthographic:true,position:view.camera.position.toArray(),target:[0,25,0]},bones:Object.fromEntries(['arm_left','leg_left','shin_left','forearm_left','eye_left'].map(n=>[n,{rotation:view.bones[n].rotation.x,scale:view.bones[n].scale.y}]))};
 };
 load('pokecenter-seated-man');restore(window.openai?.widgetState);root.dataset.ready='true';if(playing)start();
})();
</script>
<button id="center-export">Sitzsprites exportieren</button><p id="center-export-status"></p><script>
document.getElementById('center-export').onclick=async()=>{const r=document.getElementById('kanto-cobble-roster'),frames=[];for(const direction of ['front','right','back','left'])for(const [i,blinkTime]of [0,2.73,2.8,2.98].entries()){const f=r.exportFrame({id:'pokecenter-seated-man',direction,action:'ground_idle',time:0,blinkTime});frames.push({name:direction+'-'+i+'.png',png:f.png,bones:f.bones});}const reply=await fetch('/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(frames)});document.getElementById('center-export-status').textContent=reply.ok?'16 transparente Cobble-Sitzsprites gespeichert':'Export fehlgeschlagen';};</script></body></html>
